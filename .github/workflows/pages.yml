# Publica la versión de prueba (la carpeta public/, que funciona sin servidor
# en GitHub Pages) en la rama gh-pages cada vez que cambia en main.
name: Publicar la versión de prueba

on:
  push:
    branches: [main]
    paths:
      - "mesa/mesa/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el código carga
        run: |
          for f in mesa/mesa/server.js mesa/mesa/public/sw.js mesa/mesa/public/js/*.js; do node --check "$f"; done

      - name: Subir public/ a gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r mesa/mesa/public "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Versión de prueba de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
